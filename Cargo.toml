# See: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "asimov-cli"
version = "25.7.0"
authors = ["ASIMOV Community"]
edition = "2024"
rust-version = "1.97.1"
description = "ASIMOV Command-Line Interface (CLI)"
#documentation = ""
readme = true
homepage = "https://cli.asimov.sh"
repository = "https://github.com/asimov-platform/asimov-cli"
license = "Unlicense"
keywords = ["asimov", "cli", "ai", "osint"]
categories = ["command-line-utilities", "text-processing"]
publish = true

[features]
default = ["all"]
all = ["module", "proxy", "source", "telemetry"]
unstable = [
  "agent",
  "cache",
  "construct",
  "dataset",
  "flow",
  "graph",
  "handle",
  #"index",
  "message",
  "package",
  "protocol",
  "vault",
]

# Stable commands:
module = ["dep:dialoguer", "dep:tempfile"]
proxy = [
  "dep:asimov-proxy",
  "dep:dirs",
  "dep:edikt-core",
  "dep:edikt-jsonc",
  "dep:jsonc-parser",
  "dep:tempfile",
]
source = ["source-snap", "dep:infer"]
source-snap = ["dep:asimov-snapshot", "dep:jiff", "dep:hex", "dep:sha2"]
telemetry = ["dep:asimov-telemetry"]

# Unstable/experimental commands:
agent = []
cache = []
construct = []
dataset = []
flow = []
graph = []
handle = ["asimov-id/encodings"]
message = []
package = ["package-scaffold", "dep:distrib", "dep:treelog"]
package-scaffold = ["dep:asimov-module-kit"]                 # fka module-new
protocol = ["dep:asimov-protocol"]
vault = []

[build-dependencies]
cfg_aliases = "0.2"
shadow-rs = { version = "1.7", features = [
  "build",
  "tzdb",
], default-features = false }
cc = "1.2"

[dev-dependencies]
indoc = "2.0"
temp-dir = "0.1"

[dependencies]
asimov-directory = "25.7.0"
asimov-env = "25.7.0"
asimov-id = { version = "25.7.0", features = ["iroh"] }
asimov-installer = "25.7.0"
asimov-keyring = "25.7.0"
asimov-module = "25.7.0"
asimov-patterns = { version = "25.7.0", features = ["clap"] }
asimov-registry = "25.7.0"
asimov-runner = "25.7.0"
async-stream = "0.3.6"
clap = { version = "4.5", default-features = false }
clientele = { version = "0.5.0", features = ["gofer", "serde-json", "tokio"] }
color-print = "=0.3.7"
derive_more = { version = "2", features = ["display"] }
jq = "0.2.0"
known-types-pypi = { version = "0.1.5", features = ["serde"] }
known-types-rubygems = { version = "0.1.5", features = ["serde"] }
miette = { version = "7.5", features = ["fancy"] }
open = "5"
rayon = "1.11"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
  "rustls-tls-native-roots",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = { version = "0.0.13", default-features = false }
json-escape = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
] }
url = "2.5"

# Optional dependencies:
tempfile = { version = "3", optional = true }
asimov-module-kit = { version = "25.7.0", optional = true }
asimov-protocol = { version = "25.7.0", optional = true }
asimov-proxy = { version = "25.7.0", default-features = false, features = [
  "std",
  "tracing",
], optional = true }
asimov-snapshot = { version = "25.7.0", optional = true }
asimov-telemetry = { version = "25.7.0", optional = true }
dialoguer = { version = "0.12", default-features = false, features = [
  "password",
], optional = true }
hex = { version = "0.4", default-features = false, optional = true }
infer = { version = "0.22", optional = true }
jiff = { version = "0.2", default-features = false, features = [
  "alloc",
], optional = true }
mime = { version = "0.3", optional = true }
sha2 = { version = "0.11", optional = true }
treelog = { version = "0.0.6", default-features = false, features = [
  "transform",
  "walkdir",
], optional = true }

futures-lite = "2.6.1"
distrib = { version = "0.0.4", default-features = false, features = [
  "rust",
  "std",
], optional = true }

# `asimov proxy` application configuration
dirs = { version = "6", default-features = false, optional = true }
edikt-core = { version = "0.6.1", optional = true }
edikt-jsonc = { version = "0.4.0", optional = true }
iroh-base = { version = "1.2", default-features = false, features = ["key"] }
jsonc-parser = { version = "0.33", default-features = false, features = [
  "cst",
], optional = true }
secrecy = "0.10"
whoami = "2.1"

[profile.release]
opt-level = "z"
strip = true
lto = "thin"

[[bin]]
name = "asimov"
path = "src/main.rs"

[[test]]
name = "module"
path = "tests/module/main.rs"
required-features = ["module"]

# See: https://github.com/cargo-bins/cargo-binstall/blob/main/SUPPORT.md
[package.metadata.binstall]
pkg-fmt = "tgz"
bin-dir = "asimov{ binary-ext }"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.'cfg(windows)']
pkg-fmt = "zip"

[package.metadata.binstall.overrides.'cfg(all(target_os = "linux", target_arch = "aarch64"))']
pkg-url = "{ repo }/releases/download/{ version }/{ name }-{ os-name }-arm-{ target-libc }{ archive-suffix }"

[package.metadata.binstall.overrides.'cfg(all(target_os = "linux", target_arch = "x86_64"))']
pkg-url = "{ repo }/releases/download/{ version }/{ name }-{ os-name }-x86-{ target-libc }{ archive-suffix }"

[package.metadata.binstall.overrides.'cfg(all(target_os = "macos", target_arch = "aarch64"))']
pkg-url = "{ repo }/releases/download/{ version }/{ name }-{ os-name }-arm{ archive-suffix }"

[package.metadata.binstall.overrides.'cfg(all(target_os = "macos", target_arch = "x86_64"))']
pkg-url = "{ repo }/releases/download/{ version }/{ name }-{ os-name }-x86{ archive-suffix }"

[package.metadata.binstall.overrides.'cfg(all(target_os = "windows", target_arch = "aarch64"))']
pkg-url = "{ repo }/releases/download/{ version }/{ name }-{ os-name }-arm{ archive-suffix }"

[package.metadata.binstall.overrides.'cfg(all(target_os = "windows", target_arch = "x86_64"))']
pkg-url = "{ repo }/releases/download/{ version }/{ name }-{ os-name }-x64{ archive-suffix }"

