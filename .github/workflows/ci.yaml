# See: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions
---
name: CI

# WARNING! PLEASE READ BEFORE MAKING ANY CHANGES:
#
# This workflow is triggered on `pull_request_target` event,
# which makes it highly prone to security issues,
# as in this case we are executing untrusted, user-provided,
# potentially malicious code from pull requests in an environment
# that might contain overly permissive tokens or exposed secrets,
# if not implemented properly.
#
# Please only modify this file if you know what you're doing.

on:
  push:
    branches: [main, master]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  ci:
    # Pinned to an audited revision; review its nested `@master` references
    # (`ci-rust-job.yaml`, `set-env-vars`) before updating.
    uses: asimov-platform/actions/.github/workflows/ci-rust.yaml@2ff9f75cfbd6d790273dbb3e3a038048916dfef1
    # Pass only the PR review job's app credentials. That job runs no PR code,
    # whereas the shared workflow exports `ENV` to the jobs that build and test
    # the PR head, where its build scripts and tests could read it.
    secrets:
      ASIMOV_APP_ID: ${{ secrets.ASIMOV_APP_ID }}
      ASIMOV_APP_PRIVATE_KEY: ${{ secrets.ASIMOV_APP_PRIVATE_KEY }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
    with:
      building_toolchain: "1.99.1"
